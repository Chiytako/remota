<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remota">
  <title>Remota</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Login -->
  <section id="view-login" class="view" hidden>
    <div class="login-box">
      <img src="/icons/icon.svg" alt="" class="login-logo">
      <h1>Remota</h1>
      <p class="muted">サーバー起動時に表示されたトークン、またはQRコードのURLでログインします。</p>
      <form id="login-form">
        <input id="login-token" type="password" autocomplete="current-password" placeholder="アクセストークン" required>
        <button type="submit" class="btn primary">ログイン</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Session list -->
  <section id="view-home" class="view" hidden>
    <header class="bar">
      <div class="bar-title">
        <strong>Remota</strong>
        <span id="host-label" class="muted small"></span>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="設定">⚙︎</button>
    </header>
    <main class="home-main">
      <ul id="session-list" class="session-list"></ul>
      <div id="empty-state" class="empty" hidden>
        <p>セッションがありません</p>
        <p class="muted small">「＋ 新規セッション」から Claude Code や Codex を起動できます。</p>
      </div>
    </main>
    <button class="fab" id="btn-new">＋ 新規セッション</button>
  </section>

  <!-- Terminal -->
  <section id="view-term" class="view" hidden>
    <header class="bar term-bar">
      <button class="icon-btn" id="btn-back" aria-label="戻る">‹</button>
      <div class="bar-title">
        <span class="status-dot" id="term-status"></span>
        <strong id="term-name"></strong>
        <span id="term-latency" class="muted small"></span>
      </div>
      <button class="icon-btn" id="btn-font-down" aria-label="文字を小さく">A−</button>
      <button class="icon-btn" id="btn-font-up" aria-label="文字を大きく">A＋</button>
      <button class="icon-btn" id="btn-term-menu" aria-label="メニュー">⋯</button>
    </header>
    <div id="conn-banner" class="conn-banner" hidden>再接続中…</div>
    <div id="terminal-wrap"><div id="terminal"></div></div>
    <div id="keybar" class="keybar" role="toolbar" aria-label="特殊キー"></div>
    <div id="snippet-bar" class="snippet-bar" hidden></div>
    <form id="compose" class="compose">
      <button type="button" class="icon-btn" id="btn-attach" aria-label="ファイルを添付">📎</button>
      <input type="file" id="file-input" hidden multiple>
      <textarea id="compose-input" rows="1" placeholder="メッセージ / コマンド（Enterで送信）" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="send"></textarea>
      <button type="button" class="icon-btn" id="btn-mic" aria-label="音声入力">🎤</button>
      <button type="submit" class="btn primary send-btn" aria-label="送信">↑</button>
    </form>
  </section>

  <!-- Sheets -->
  <dialog id="dlg-new" class="sheet">
    <form method="dialog" id="new-form">
      <h2>新規セッション</h2>
      <label>起動するもの
        <div id="preset-list" class="chips"></div>
      </label>
      <label>コマンド
        <input id="new-command" placeholder="空欄ならシェルのみ" autocapitalize="off" spellcheck="false">
      </label>
      <label>作業ディレクトリ
        <input id="new-cwd" list="cwd-history" autocapitalize="off" spellcheck="false">
        <datalist id="cwd-history"></datalist>
      </label>
      <label>名前（任意）
        <input id="new-name" autocapitalize="off">
      </label>
      <p id="new-error" class="error" hidden></p>
      <div class="sheet-actions">
        <button value="cancel" class="btn" formnovalidate>キャンセル</button>
        <button value="ok" class="btn primary" id="new-submit">起動</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-menu" class="sheet">
    <form method="dialog">
      <h2 id="menu-title">セッション</h2>
      <div class="menu-list">
        <button value="snippets" class="btn">定型文の表示 / 非表示</button>
        <button value="edit-snippets" class="btn">定型文を編集</button>
        <button value="edit-keys" class="btn">キーバーを編集</button>
        <button value="rename" class="btn">名前を変更</button>
        <button value="copy" class="btn">画面のテキストをコピー</button>
        <button value="kill" class="btn danger">セッションを終了</button>
        <button value="cancel" class="btn">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-edit" class="sheet">
    <form method="dialog">
      <h2 id="edit-title"></h2>
      <p id="edit-help" class="muted small"></p>
      <textarea id="edit-text" rows="10" spellcheck="false" autocapitalize="off"></textarea>
      <div class="sheet-actions">
        <button value="reset" class="btn" formnovalidate>初期値に戻す</button>
        <button value="cancel" class="btn" formnovalidate>キャンセル</button>
        <button value="ok" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-settings" class="sheet">
    <form method="dialog">
      <h2>設定</h2>
      <div class="setting">
        <div>
          <strong>プッシュ通知</strong>
          <p class="muted small" id="push-state"></p>
        </div>
        <button type="button" class="btn" id="btn-push">有効化</button>
      </div>
      <div class="setting">
        <div><strong>通知テスト</strong></div>
        <button type="button" class="btn" id="btn-push-test">送信</button>
      </div>
      <label class="setting">
        <div><strong>音声入力の言語</strong></div>
        <select id="set-lang">
          <option value="ja-JP">日本語</option>
          <option value="en-US">English</option>
          <option value="zh-CN">中文</option>
          <option value="ko-KR">한국어</option>
        </select>
      </label>
      <label class="setting">
        <div><strong>Enterで送信</strong><p class="muted small">オフにすると改行、送信は↑ボタン</p></div>
        <input type="checkbox" id="set-enter-send">
      </label>
      <label class="setting">
        <div><strong>送信後に自動でEnter</strong><p class="muted small">定型文・入力欄からの送信時</p></div>
        <input type="checkbox" id="set-auto-enter">
      </label>
      <div class="setting">
        <div><strong>エージェント連携</strong><p class="muted small">サーバーで <code>remota hooks</code> を実行すると Claude Code の完了/承認待ちを確実に通知できます。</p></div>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn danger" id="btn-logout">ログアウト</button>
        <button value="ok" class="btn primary">閉じる</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/app.js"></script>
</body>
</html>
