name: Android

on:
  push:
    paths: ["android/**", "public/**", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "public/**", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app bundles the web UI and its xterm.js / jsQR files from node_modules.
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and test
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: remota-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
